name: rentify_nitification
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.4.1
  uuid: ^4.5.1
  permission_handler: ^12.0.1
  intl: ^0.20.2
  equatable: ^2.0.7
  dio: ^5.8.0+1
  google_fonts: ^6.2.1
  talker: ^4.9.1
  talker_dio_logger: ^4.9.1
  talker_flutter: ^4.9.1
  talker_bloc_logger: ^4.9.1
  go_router: ^16.0.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.0
  infinite_scroll_pagination: ^4.1.0
  get_it: ^8.0.3
  easy_localization: ^3.0.8
  flutter_staggered_grid_view: ^0.7.0
  bloc: ^9.0.0
  pin_code_fields: ^8.0.1
  flutter_intl_phone_field: ^0.0.7
  yandex_mapkit: ^4.1.0
  skeletonizer: ^2.1.0+1
  flutter_compass: ^0.8.1
  smooth_page_indicator: ^1.2.1
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.2.0
  geolocator: ^14.0.2
  widgets_easier: ^0.0.10
  cloud_firestore: ^6.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/langs/
    - assets/images/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Black.ttf
          weight: 900
          style: normal
        - asset: assets/fonts/Raleway-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/Raleway-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Raleway-ExtraBold.ttf
          weight: 800
          style: normal
        - asset: assets/fonts/Raleway-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Raleway-ExtraLight.ttf
          weight: 200
          style: normal
        - asset: assets/fonts/Raleway-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Raleway-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Raleway-Light.ttf
          weight: 300
          style: normal
        - asset: assets/fonts/Raleway-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Raleway-Medium.ttf
          weight: 500
          style: normal
        - asset: assets/fonts/Raleway-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Raleway-Regular.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/Raleway-SemiBold.ttf
          weight: 600
          style: normal
        - asset: assets/fonts/Raleway-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Raleway-Thin.ttf
          weight: 100
          style: normal
        - asset: assets/fonts/Raleway-ThinItalic.ttf
          weight: 100
          style: italic
